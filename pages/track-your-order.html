<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Your Order – LOOK OPTIC</title>
<link rel="stylesheet" href="../cdn/shop/t/690/assets/base.css">
<style>
body {
  font-family: "Avenir Next", Figtree, sans-serif;
  color: #101010;
  margin: 0;
  background: #fff;
}
.track-page {
  max-width: 500px;
  margin: 80px auto;
  padding: 0 20px;
  text-align: center;
}
.track-page h1 {
  font-family: "DIN Condensed", Figtree, sans-serif;
  font-size: 2.8rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.3rem;
  margin-bottom: 40px;
  line-height: 1;
}
.track-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.track-form input {
  width: 100%;
  padding: 14px 16px;
  font-size: 1rem;
  font-family: inherit;
  border: 1px solid #ccc;
  border-radius: 0;
  box-sizing: border-box;
  outline: none;
  transition: border-color 0.2s;
}
.track-form input:focus {
  border-color: #333;
}
.track-form input::placeholder {
  color: #999;
}
.track-form button {
  width: 100%;
  padding: 15px;
  font-size: 1rem;
  font-family: "DIN Condensed", Figtree, sans-serif;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.2rem;
  background: #333;
  color: #fff;
  border: none;
  cursor: pointer;
  margin-top: 4px;
  transition: background-color 0.2s;
}
.track-form button:hover {
  background: #555;
}
.track-result {
  margin-top: 30px;
  text-align: left;
  display: none;
}
.track-result.active {
  display: block;
}
.track-result p {
  color: #666;
  font-size: 0.95rem;
  line-height: 1.6;
}
</style>
</head>
<body>
<main>
<div class="track-page">
  <h1>Track Your Order</h1>
  <div class="track-form">
    <input type="text" id="track-order" placeholder="Order number or tracking code">
    <input type="email" id="track-email" placeholder="Email address">
    <button onclick="trackOrder()">Search</button>
  </div>
  <div class="track-result" id="track-result">
    <p>For order tracking, please contact us at <a href="mailto:hello@lookoptic.com" style="color:#435a6f;">hello@lookoptic.com</a> or call <strong>(877) 857-LOOK</strong> with your order number.</p>
  </div>
</div>
</main>
<script>
function trackOrder() {
  var order = document.getElementById('track-order').value;
  var email = document.getElementById('track-email').value;
  if (order || email) {
    document.getElementById('track-result').classList.add('active');
  }
}
</script>
</body>
</html>
